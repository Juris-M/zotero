firstRunGuidance.quickFormat	= ஒரு குறிப்பைத் தேட ஒரு தலைப்பு அல்லது ஆசிரியரைத் தட்டச்சு செய்க.\nநீங்கள் தேர்ந்தெடுத்த பிறகு, பக்க எண்கள், முன்னொட்டுகள் அல்லது பின்னொட்டுகளைச் சேர்க்க குமிழியைக் சொடுக்கவும் அல்லது கட்டுபாடு-↓ ஐ அழுத்தவும்.உங்கள் தேடல் சொற்களுடன் ஒரு பக்க எண்ணை நேரடியாகச் சேர்க்க நீங்கள் சேர்க்கலாம்.\n\nநீங்கள் மேற்கோள்களைச் சொல் செயலி ஆவணத்தில் நேரடியாகத் திருத்தலாம்.
