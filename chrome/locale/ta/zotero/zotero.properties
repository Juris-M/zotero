sync.storage.error.verificationFailed	= %S சரிபார்ப்பு தோல்வியடைந்தது. சோட்டெரோ விருப்பங்களின் ஒத்திசைவு பலகத்தில் உங்கள் கோப்பு ஒத்திசைவு அமைப்புகளைச் சரிபார்.
sync.storage.error.webdav.checkSettingsOrContactAdmin	= இந்தச் செய்தியை நீங்கள் மீண்டும் மீண்டும் பெற்றால், உங்கள் வலைடிஎவி சேவையக அமைப்புகளைச் சரிபார் அல்லது உங்கள் வலைடிஎவி சேவையக நிர்வாகியைத் தொடர்பு கொள்ளவும்.
sync.storage.error.webdav.default	= ஒரு வலைடிஎவி கோப்பு ஒத்திசைவு பிழை ஏற்பட்டது. தயவுசெய்து மீண்டும் ஒத்திசைக்க முயற்சிக்கவும். \n\n இந்தச் செய்தியை நீங்கள் மீண்டும் மீண்டும் பெற்றால், சோட்டெரோ விருப்பங்களின் ஒத்திசைவு பலகத்தில் உங்கள் வலைடிஎவி சேவையக அமைப்புகளைச் சரிபார்.
sync.storage.error.webdav.defaultRestart	= ஒரு வலைடிஎவி கோப்பு ஒத்திசைவு பிழை ஏற்பட்டது. தயவுசெய்து %S ஐ மறுதொடக்கம் செய்து மீண்டும் ஒத்திசைக்க முயற்சி. \n\n இந்தச் செய்தியை மீண்டும் மீண்டும் பெற்றால், உங்கள் வலைடிஎவி சேவையக அமைப்புகளைச் சோட்டெரோ விருப்பங்களின் ஒத்திசைவு பலகத்தில் சரிபார்.
sync.storage.error.webdav.enterURL	= தயவுசெய்து ஒரு வலைடிஎவி முகவரி ஐ உள்ளிடவும்.
sync.storage.error.webdav.fileMissingAfterUpload	= உங்கள் வலைடிஎவி சேவையகத்துடன் ஒரு சாத்தியமான சிக்கல் கண்டறியப்பட்டது. \n\n ஒரு பதிவேற்றிய கோப்பு பதிவிறக்கம் செய்ய உடனடியாகக் கிடைக்கவில்லை. நீங்கள் கோப்புகளைப் பதிவேற்றும்போது அவை கிடைக்கும்போது ஒரு குறுகிய நேரந்தவறுகை இருக்கலாம், குறிப்பாக நீங்கள் முகில் ச்டோரேச் சேவையைப் பயன்படுத்துகிறீர்கள் என்றால். \n\nசோட்டெரோ கோப்பு ஒத்திசைவு பொதுவாக வேலை செய்வதாகத் தோன்றினால், இந்தச் செய்தியை நீங்கள் புறக்கணிக்கலாம். உங்களுக்குச் சிக்கல் இருந்தால், தயவுசெய்து சோடெரோ மன்றங்களில் இடுகையிடவும்.
sync.storage.error.webdav.insufficientSpace	= வலைடிஎவி சேவையகத்தில் போதுமான இடம் இல்லாததால் கோப்பு பதிவேற்றம் தோல்வியடைந்தது.
sync.storage.error.webdav.invalidLogin	= நீங்கள் உள்ளிட்ட பயனர்பெயர் மற்றும் கடவுச்சொல்லை வலைடிஎவி சேவையகம் ஏற்கவில்லை.
sync.storage.error.webdav.invalidURL	= %S செல்லுபடியாகும் வலைடிஎவி முகவரி அல்ல.
