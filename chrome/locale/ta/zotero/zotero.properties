zotero.preferences.sync.reset.fileSyncHistory	= அடுத்த ஒத்திசைவில், %1$S அனைத்து இணைப்பு கோப்புகளையும் சேமிப்பக சேவைக்கு எதிராக “%2$S” இல் சரிபார்க்கும். உள்நாட்டில் காணாமல் போன எந்தத் தொலைநிலை இணைப்புக் கோப்புகளும் பதிவிறக்கம் செய்யப்படும், மேலும் உள்ளக இணைப்புக் கோப்புகள் தொலைதூரத்தில் காணாமல் போகும். \n\n சாதாரண பயன்பாட்டின்போது இந்த விருப்பம் தேவையில்லை.
