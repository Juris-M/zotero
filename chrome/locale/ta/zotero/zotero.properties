sync.error.groupWriteAccessLost	= ‘%1$S’ குழுவிற்கு நீங்கள் இனி எழுதும் அணுகல் இல்லை, மேலும் நீங்கள் உள்நாட்டில் செய்த மாற்றங்களைப் பதிவேற்ற முடியாது. நீங்கள் தொடர்ந்தால், குழுவின் உங்கள் நகல் %2$S இல் அதன் நிலைக்கு மீட்டமைக்கப்படும், மேலும் உருப்படிகள் மற்றும் கோப்புகளில் உள்ளக மாற்றங்கள் இழக்கப்படும்.
