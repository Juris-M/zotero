sync.storage.error.webdav.loadURLForMoreInfo	= மேலும் தகவலுக்கு உங்கள் வலைடிஎவி முகவரி ஐ உலாவியில் ஏற்றவும்.
sync.storage.error.webdav.nonexistentFileNotMissing	= உங்கள் வலைடிஎவி சேவையகம் இல்லாத கோப்பு இருப்பதாகக் கூறுகிறது. உதவிக்கு உங்கள் வலைடிஎவி சேவையக நிர்வாகியைத் தொடர்பு கொள்ளவும்.
sync.storage.error.webdav.permissionDenied	= வலைடிஎவி சேவையகத்தில் %S ஐ அணுக உங்களுக்கு இசைவு இல்லை.
